<html>
    <head>
        <link rel="stylesheet" href="style.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="header">
            <h2 id="title">SLU Portal Schedule Converter</h2>
        </div>

        <div class="main-section">
            <div class="description">Click on your desired file format:</div>
            <div class="btn-container">
                <button id="ics-btn">Export to iCalendar (.ics)</button>
                <button id="csv-btn">Export to CSV (.csv)
                    <div class="warning1">Schedule for today ONLY!</div> 
                </button>
                
                <button id="json-btn">Export to JSON (.json)</button>
            </div>        
        </div>

        <footer>
            <a href="https://github.com/jondelvic/slu-portal-schedule-converter" target="_blank"><img src="/images/github-mark-white.svg" id="github-logo"></a>
        </footer>

        <script type="module" src="popup.js"></script>
    </body>
</html>
